# The Cloud Run service for www in the develop environment (the shared GCP dev project).
# Scaffolded by rig-setup/update to the site's deploy/www.develop.yaml. The file
# is the site's own: adjust scaling/resources here and commit.
#
# This is an INFRA SKELETON. Env variables do not belong here:
#   env + secrets   come from www/.env.template via `rig gcloud-env`
#                   (op:// → Secret Manager, rig://<service>/<facet> →
#                   the dev environment's facts, rig-secret:// → secret bindings)
#   image           set by CI (gcloud run deploy --image) on every push
#   this file       applied by `rig gcloud-apply`, which re-syncs env
#                   afterwards, since `services replace` resets it
#
# __IMAGE__ is replaced by gcloud-apply with the service's current image. Do not
# change it.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: __SITE__-www
  labels:
    rig-site: __SITE__
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "2"
    spec:
      containerConcurrency: 80
      timeoutSeconds: 60
      containers:
        - image: __IMAGE__
          ports:
            - containerPort: 8080
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
