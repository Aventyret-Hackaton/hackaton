map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

upstream nextjs {
  server 127.0.0.1:3000;
}

# Browser traffic gets TLS from the rig's Traefik proxy (routes to 8080).
# Direct container→container calls (docker-DNS hostnames, bypassing Traefik)
# hit 443 here — init.sh writes tls.conf when the rig-issued site cert is
# available; the wildcard include is a no-op otherwise.
server {
  listen 8080;
  include /etc/nginx/cert/*.conf;
  server_name _;

  location / {
    proxy_http_version 1.1;

    # HMR/WebSocket/SSE: allow upgrade for all requests
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # Standard proxy headers
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Dev-friendly timeouts
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    # HMR is faster without buffering (optional but good)
    proxy_buffering off;

    # In dev you rarely want caching
    proxy_cache_bypass 1;

    proxy_pass http://nextjs;
  }
}
