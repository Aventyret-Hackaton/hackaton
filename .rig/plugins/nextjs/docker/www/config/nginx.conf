# /etc/nginx/nginx.conf

pid /run/nginx/nginx.pid;
worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  server_tokens off;
  sendfile on;
  tcp_nopush on;

  # Log format and logs (for complete silence: set access_log off;)
  log_format main '[$time_iso8601] "$request" $status $body_bytes_sent "$http_referer"';
  error_log  /var/log/nginx/error.log warn;

  # Skip access logs for Next/HMR resources
  map $uri $loggable {
    default 1;
    ~^/(?:_next(?:/|$)|__nextjs(?:/|$)|__nextjs_source-map(?:/|$)) 0;
  }
  access_log /var/log/nginx/access.log main if=$loggable;

  # Load your server blocks (e.g. /etc/nginx/conf.d/default.conf)
  include /etc/nginx/conf.d/*.conf;
}
