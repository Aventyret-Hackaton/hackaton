upstream php {
        server unix:/run/php-fpm/php-fpm.sock;
}

# The distro's fastcgi_params sets HTTP_HOST to $host, which drops the port, so
# WordPress builds standalone URLs (redirect_to) without :8081. Keep the client's
# port only when the Host header names the same host nginx resolved; anything
# else falls back to $host, as the distro intends.
map "$host|$http_host" $rig_http_host {
        default                                 $host;
        "~*^(?<rig_h>[^|]+)\|\k<rig_h>(?<rig_p>:[0-9]{1,5})$"  $rig_h$rig_p;
}

# Browser traffic gets TLS from the rig's Traefik proxy (routes to 8080).
# Direct container→container calls (docker-DNS hostnames, bypassing Traefik)
# hit 443 here — init.sh writes tls.conf when the rig-issued site cert is
# available; the wildcard include is a no-op otherwise.
#
# absolute_redirect off: nginx's own slash redirects (wp-admin → wp-admin/) send
# a relative Location, keeping both Traefik's https and the standalone port.
server {
        listen                  8080;
        include                 /etc/nginx/cert/*.conf;
        server_name             _;
        root                    /service/cms/web;
        access_log              /dev/stdout main;
        error_log               /dev/stdout;
        absolute_redirect       off;
        index index.php;

        location = /favicon.ico {
                log_not_found off;
                access_log off;
        }

        location = /robots.txt {
                allow all;
                log_not_found off;
                access_log off;
        }

        include /service/cms/.rig/site-*.conf;

        location / {
                try_files $uri $uri/ /index.php?$args;
        }

        location ~ \.php$ {
                include fastcgi_params;
                fastcgi_read_timeout 300;
                fastcgi_send_timeout 300;
                fastcgi_connect_timeout 300;
                fastcgi_intercept_errors on;
                fastcgi_pass php;
                fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
                fastcgi_param  HTTP_HOST       $rig_http_host;
        }

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
                expires max;
                access_log off;
        }

        # Subdomain multisite rewrites
        rewrite ^/(wp-.*.php)$ /wp/$1 last;
        rewrite ^/(wp-(content|admin|includes).*) /wp/$1 last;

}
