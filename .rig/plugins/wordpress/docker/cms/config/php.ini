; PHP settings shared by CLI and FPM (loaded from conf.d).
; The FPM pool itself is configured in php-fpm.d/www.conf — NOT here. PHP's INI
; parser ignores [section] headers, so any pool directive placed here would be
; flattened into the global scope and silently ignored (or worse, misread).

mysqli.max_persistent = 300

; /rig/cert/ca-bundle.crt is the rig's full bundle (public roots + mkcert
; rootCA), mounted read-only via the shared rig-cert volume. Pointing curl and
; openssl here means PHP/composer/wp-cli trust both external HTTPS and the
; rig's *.test certs without a root-only update-ca-certificates step.
curl.cainfo = "/rig/cert/ca-bundle.crt"
openssl.cafile = "/rig/cert/ca-bundle.crt"

log_errors = 1
display_errors = 0
error_log = /proc/self/fd/2

memory_limit = 1024M
max_execution_time = 300
max_input_time = 60
max_input_vars = 3000
upload_max_filesize = 128M
post_max_size = 256M

[opcache]
opcache.enable = 1
opcache.validate_timestamps = 1
opcache.max_accelerated_files = 262237
opcache.memory_consumption = 192
opcache.max_wasted_percentage = 10
opcache.interned_strings_buffer = 32
opcache.fast_shutdown = 1
opcache.max_file_size = 10M
opcache.log_verbosity_level = 1
