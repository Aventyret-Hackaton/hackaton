# Thin stub, written by the rig (plugins/github/vendor.sh). A push to main
# builds the release (:sha-<sha7>, build once), deploys it to the dev environment and
# RC-tags the candidate (YYYY.MM.N-rc.M, hence contents: write); a push to
# hotfix/* only builds. Production = Actions → release (promotes an RC to
# stable CalVer). docs/BRANCH_STRATEGY.md in aventyret-rig.
name: main
on:
  push:
    branches: [main, "hotfix/**"]
concurrency:
  group: main-${{ github.ref_name }}
  cancel-in-progress: false
jobs:
  main:
    uses: Aventyret/aventyret-rig/.github/workflows/site-main.yml@v2
    secrets: inherit
    permissions:
      contents: write
      id-token: write
      packages: write
      pull-requests: read
      deployments: write
  # site-deploy: begin (kept only when the site owns .github/workflows/deploy.yml)
  # The new RC goes to dev unless an open PR holds the dev-deploy label.
  deploy-dev:
    needs: main
    if: needs.main.outputs.deploy_dev == '1'
    concurrency:
      group: deploy-dev
      cancel-in-progress: false
    uses: ./.github/workflows/deploy.yml
    with:
      environment: dev
      version: ${{ needs.main.outputs.version }}
    secrets: inherit
    permissions:
      contents: read
      id-token: write
      packages: read
      deployments: write
  # site-deploy: end
